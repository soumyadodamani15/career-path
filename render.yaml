services:
  - type: web
    name: career-engine
    runtime: python
    rootDir: datascience
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
    disk:
      name: career-engine-data
      mountPath: /data
      sizeGB: 2